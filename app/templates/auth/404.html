{% extends "base.html" %}
{% block title %}Page Not Found (404) — TravelTech{% endblock %}
{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-5 p-5">
                <div class="d-inline-flex align-items-center justify-content-center bg-secondary-subtle text-secondary rounded-circle p-4 mb-3 mx-auto">
                    <i class="bi bi-map fs-1"></i>
                </div>
                <h3 class="fw-bold">404 — Off the Map</h3>
                <p class="text-muted my-3">The destination or resource you are looking for doesn't exist or has moved.</p>
                <div>
                    <a href="{{ url_for('auth.index') }}" class="btn btn-primary rounded-pill px-4">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
