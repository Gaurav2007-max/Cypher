{% extends "base.html" %}
{% block title %}Access Denied (403) — TravelTech{% endblock %}
{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-5 p-5">
                <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-4 mb-3 mx-auto">
                    <i class="bi bi-shield-x fs-1"></i>
                </div>
                <h3 class="fw-bold">403 — Access Forbidden</h3>
                <p class="text-muted my-3">You do not have the required role or authorization to access this secured portal.</p>
                <div>
                    <a href="{{ url_for('auth.index') }}" class="btn btn-danger rounded-pill px-4">Return Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
