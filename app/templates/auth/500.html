{% extends "base.html" %}
{% block title %}Internal Server Error (500) — TravelTech{% endblock %}
{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-5 p-5">
                <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-4 mb-3 mx-auto">
                    <i class="bi bi-exclamation-octagon fs-1"></i>
                </div>
                <h3 class="fw-bold">500 — Server Incident</h3>
                <p class="text-muted my-3">Our systems encountered an unexpected condition. Please try again shortly.</p>
                <div>
                    <a href="{{ url_for('auth.index') }}" class="btn btn-outline-dark rounded-pill px-4">Reload</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
