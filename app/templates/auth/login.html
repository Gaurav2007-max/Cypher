{% extends "base.html" %}

{% block title %}Sign In — TravelTech Smart Cultural Exploration{% endblock %}

{% block content %}
<div class="login-page container-fluid d-flex align-items-center justify-content-center">
    <div class="container py-5 my-auto" style="position: relative; z-index: 5;">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5 col-xl-4">
                <div class="card border-0 shadow-lg rounded-5 overflow-hidden" style="background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(16px);">
                    
                    <!-- Visual Header with Travel Badge -->
                    <div class="p-4 pt-5 text-center">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle p-3 mb-3 shadow-sm anim-float">
                            <i class="bi bi-compass-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
                        <p class="text-muted small">Explore heritage, discover hidden gems & travel safely</p>
                    </div>

                    <div class="card-body p-4 pt-0">
                        <form id="loginForm" method="POST" action="{{ url_for('auth.login') }}">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Username or Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="bi bi-person text-muted"></i></span>
                                    <input type="text" name="identifier" id="loginIdentifier" class="form-control bg-light border-0 py-2" placeholder="alex_traveler" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label class="form-label small fw-bold text-muted">Password</label>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" name="password" id="loginPassword" class="form-control bg-light border-0 py-2" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm py-2">
                                    Sign In <i class="bi bi-arrow-right ms-1"></i>
                                </button>
                            </div>
                        </form>

                        <!-- Quick Demo Fill Buttons for Evaluation -->
                        <div class="mt-4 pt-3 border-top text-center">
                            <div class="text-uppercase text-muted fw-bold mb-2" style="font-size: 0.68rem; letter-spacing: 0.8px;">
                                One-Click Demo Showcase Roles
                            </div>
                            <div class="d-flex flex-column gap-2">
                                <button type="button" class="btn btn-sm btn-outline-primary rounded-pill fw-semibold py-2 d-flex align-items-center justify-content-center gap-2" onclick="loginWithDemo('alex_traveler', 'tourist123')" aria-label="Sign in as the tourist demo">
                                    <i class="bi bi-geo-alt-fill text-primary"></i>
                                    <span>Tourist Demo (Faridabad Showcase)</span>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-primary rounded-pill fw-semibold py-2 d-flex align-items-center justify-content-center gap-2" onclick="loginWithDemo('officer_sharma', 'authority123')" aria-label="Sign in as the authority demo">
                                    <i class="bi bi-shield-check text-primary"></i>
                                    <span>Authority Demo (Crowd Manager)</span>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-dark rounded-pill fw-semibold py-2 d-flex align-items-center justify-content-center gap-2" onclick="loginWithDemo('admin', 'admin123')" aria-label="Sign in as the administrator demo">
                                    <i class="bi bi-shield-lock text-dark"></i>
                                    <span>Administrator Console</span>
                                </button>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <span class="text-muted small">New to TravelTech?</span>
                            <a href="{{ url_for('auth.register') }}" class="fw-bold text-primary text-decoration-none small ms-1">Create Account</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function loginWithDemo(username, password) {
    document.getElementById('loginIdentifier').value = username;
    document.getElementById('loginPassword').value = password;
    document.getElementById('loginForm').requestSubmit();
}
</script>
{% endblock %}
